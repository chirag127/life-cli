# himalaya config sample — copy to config/himalaya-config.toml (git-ignored) or ~/.config/himalaya/config.toml
# Gmail: IMAP 993 TLS, SMTP 465 TLS. Use a Gmail App Password, not the account password.

[accounts.gmail]
email = "you@gmail.com"
display-name = "Mail Agent"
default = true

backend.type = "imap"
backend.host = "imap.gmail.com"
backend.port = 993
backend.encryption.type = "tls"
backend.login = "you@gmail.com"
backend.auth.type = "password"
backend.auth.raw = "xxxx xxxx xxxx xxxx"

message.send.backend.type = "smtp"
message.send.backend.host = "smtp.gmail.com"
message.send.backend.port = 465
message.send.backend.encryption.type = "tls"
message.send.backend.login = "you@gmail.com"
message.send.backend.auth.type = "password"
message.send.backend.auth.raw = "xxxx xxxx xxxx xxxx"
