[project]
name = "mail-agent"
version = "0.1.0"
description = "CLI email agent + mutual-fund document requester (himalaya-backed)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["python-dotenv>=1.2.2", "casparser>=0.8.0", "pyxirr>=0.10.8"]

[project.scripts]
mail-agent = "mail_agent.request:main"

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_agent"]
artifacts = ["mail_agent/templates/*.txt", "mail_agent/templates/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
