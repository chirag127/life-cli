[project]
name = "mail-agent"
version = "0.1.0"
description = "CLI email agent + mutual-fund document requester (Gmail API OAuth2, SMTP, or himalaya backends)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["python-dotenv>=1.2.2", "casparser>=1.3.0", "pyxirr>=0.10.8", "google-api-python-client>=2.198.0", "google-auth-oauthlib>=1.4.0", "google-auth>=2.56.3"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
microsoft = ["msgraph-sdk>=1.61.0", "azure-identity>=1.25.3"]

[project.scripts]
mail-agent = "life_cli.request:main"
gtool = "life_cli.gtool:main"
gsuite = "life_cli.gtool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["life_cli"]
artifacts = ["life_cli/templates/*.txt", "life_cli/templates/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
